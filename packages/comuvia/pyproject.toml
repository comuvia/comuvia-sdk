[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "comuvia"
dynamic = ["version"]
description = "Offline, provider-neutral evidence and prediction records: validation, canonical identity, append-only storage and binary evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Comuvia" }]
keywords = ["forecasting", "provenance", "evidence", "brier", "canonical-json"]
# Python version classifiers name only versions measured on the release matrix
# (CPython 3.11, 3.12 and 3.13 on Windows x86-64 and Linux x86-64).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/comuvia/comuvia-sdk"
Documentation = "https://github.com/comuvia/comuvia-sdk/tree/main/documentation/tutorials"
Issues = "https://github.com/comuvia/comuvia-sdk/issues"

[project.scripts]
comuvia = "comuvia.cli:main"

[tool.flit.module]
name = "comuvia"

# Distribution contents are listed explicitly; Git ignore rules are not a packaging boundary.
# The wheel holds only src/comuvia; the sdist adds pyproject.toml, README.md, PKG-INFO and these paths.
[tool.flit.sdist]
include = ["tests/", "CHANGELOG.md"]
exclude = ["**/__pycache__", "**/*.py[cod]"]
