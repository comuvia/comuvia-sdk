# Offline source, vector, fixture and installed-distribution verification across platforms.
#
# Every action is pinned to a full commit id matching release.yml; no credentials are
# persisted and package_smoke.py check runs with pip --no-index under a network-blocking
# Python audit hook.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check vectors, fixtures, tools and source suites
        shell: bash
        run: |
          python -I tools/sync_vectors.py --check
          python -I tools/check_fixtures.py
          python -I tools/check_source.py --package comuvia
          python -I -m unittest discover -s tools/tests
      - name: Build byte-reproducible distributions and run offline installed checks
        shell: bash
        run: |
          out_dir="${RUNNER_TEMP}/comuvia-smoke-out"
          work_dir="${RUNNER_TEMP}/comuvia-smoke-work"
          python -I tools/package_smoke.py build --out "${out_dir}"
          python -I tools/package_smoke.py check \
            --dist "${out_dir}/dist" \
            --work "${work_dir}" \
            --tutorials documentation/tutorials \
            --fixtures fixtures/synthetic
