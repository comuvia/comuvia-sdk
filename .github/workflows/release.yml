# Publishes one distribution pair to one package index, by manual dispatch only.
#
# Order: dispatch `comuvia`, verify it from the index, then dispatch `foreglass`.
# The build job has no publishing identity. It rebuilds all four 0.1.0 files with the
# committed recipe (release/0.1.0/BUILD.md) and fails unless every file matches
# release/0.1.0/SHA256SUMS. The publish job runs only after the owner approves the
# `testpypi` or `pypi` environment. It holds the only `id-token: write` permission and
# re-checks the two selected files against the approved digests before uploading them
# through PyPI Trusted Publishing, with attestations.
#
# Every action is pinned to a full commit id; the comment names its release tag.

name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to publish (comuvia first, then foreglass)
        type: choice
        options: [comuvia, foreglass]
        required: true
      index:
        description: Package index, which is also the approving GitHub environment
        type: choice
        options: [testpypi, pypi]
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and require the approved digests
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.select.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build all four distributions with the pinned recipe
        run: python -I tools/build_release.py build --out dist-release/0.1.0
      - name: Require release/0.1.0/SHA256SUMS
        run: python -I tools/build_release.py check dist-release/0.1.0
      - name: Select the dispatched package
        id: select
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          mkdir upload
          cp "dist-release/0.1.0/${PACKAGE}-0.1.0-py3-none-any.whl" "dist-release/0.1.0/${PACKAGE}-0.1.0.tar.gz" upload/
          grep -E "  ${PACKAGE}-0\.1\.0(-py3-none-any\.whl|\.tar\.gz)$" release/0.1.0/SHA256SUMS > selected.sums
          test "$(wc -l < selected.sums)" -eq 2
          cat selected.sums
          echo "sums=$(base64 -w0 selected.sums)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: upload/
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && format('https://pypi.org/project/{0}/0.1.0/', inputs.package) || format('https://test.pypi.org/project/{0}/0.1.0/', inputs.package) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Re-check the approved digests
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          echo "$SUMS" | base64 -d > expected.sums
          test "$(find dist -mindepth 1 | wc -l)" -eq 2
          (cd dist && sha256sum --strict --check ../expected.sums)
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
          attestations: true
